name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, nuc01]
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release branch
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build verified release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release
      - name: Record validated tag
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: [self-hosted, Linux, X64, nuc01]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: artifacts
      - name: Verify artifact checksum
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "artifacts/more-boosty-$RELEASE_TAG.zip" \
            artifacts/SHA256SUMS \
            --verify-tag \
            --title "More Boosty $RELEASE_TAG" \
            --notes-file artifacts/release-notes.md
